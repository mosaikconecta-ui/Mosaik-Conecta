<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post Criação de Sites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d0d0f}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;font-family:Sora,system-ui,sans-serif}
#post{position:relative;width:1080px;height:1350px;overflow:hidden;flex:none;transform-origin:top center;
  background:radial-gradient(ellipse 85% 65% at 50% 48%,#fcfcfd 0%,#f1f1f3 55%,#e2e2e6 100%)}
.a{position:absolute}
.glass{background:radial-gradient(circle at 30% 22%,#fff 0%,#f5f5f7 55%,#e6e6ea 100%);
  box-shadow:0 30px 60px rgba(20,20,22,.12),inset 0 -8px 18px rgba(0,0,0,.04),inset 0 4px 10px #fff,0 0 0 2px rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center}
.clay{background:radial-gradient(circle at 32% 26%,#ff7480 0%,#ef3040 30%,#d8192a 58%,#8f0c18 100%);
  box-shadow:inset -10px -14px 24px rgba(60,0,8,.35),inset 8px 10px 20px rgba(255,255,255,.35),0 26px 50px rgba(225,29,46,.38)}
.chip{position:absolute;display:flex;align-items:center;gap:16px;height:92px;padding:0 34px 0 18px;border-radius:46px;
  background:linear-gradient(180deg,#fff,#f4f4f6);box-shadow:0 24px 50px rgba(20,20,22,.14),0 0 0 2px rgba(255,255,255,.95);
  font:600 32px Sora;letter-spacing:-.02em;color:#141416;white-space:nowrap}
.chip .ib{width:58px;height:58px;border-radius:18px;background:#fdeceb;display:flex;align-items:center;justify-content:center}
.chip.dark{background:#141416;color:#fff;box-shadow:0 24px 50px rgba(20,20,22,.35)}
.chip.dark .ib{background:#e11d2e}
.bar{position:absolute;left:0;right:0;top:0;height:58px;background:#f5f5f6;border-bottom:2px solid #ececef}
.bar i{position:absolute;top:22px;width:14px;height:14px;border-radius:50%}
.ln{height:12px;border-radius:6px;background:#ececef}
.lg{font:800 28px Sora;letter-spacing:-.04em;color:#141416;display:flex;align-items:center;gap:9px}
.lg:before{content:"";width:13px;height:13px;border-radius:50%;background:#e11d2e}
</style>
</head>
<body>
<div id="post">
  <!-- profundidade: formas desfocadas -->
  <div class="a glass" style="left:-90px;top:610px;width:250px;height:250px;border-radius:70px;filter:blur(7px);transform:rotate(-14deg)">
    <svg width="104" height="104" viewBox="0 0 24 24" fill="none" stroke="#e11d2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
  <div class="a glass" style="left:900px;top:-70px;width:280px;height:280px;border-radius:50%;filter:blur(9px)">
    <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#cfcfd4" stroke-width="1.4" stroke-linecap="round"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></svg></div>

  <!-- título -->
  <div class="a" style="left:80px;top:86px;font:700 26px Sora;letter-spacing:.3em;color:#e11d2e">CRIAÇÃO DE SITES</div>
  <div class="a" style="left:76px;top:132px;font:500 74px/1.06 Sora;letter-spacing:-.045em;color:#2a2a30;white-space:nowrap">Seu site não precisa</div>
  <div class="a" style="left:72px;top:206px;font:800 112px/1.1 Sora;letter-spacing:-.055em;color:#141416;white-space:nowrap">ser <span style="color:#e11d2e">complicado.</span></div>
  <svg class="a" style="left:300px;top:332px" width="640" height="70" viewBox="0 0 640 70"><path d="M10 28 C 170 12, 400 10, 628 20 C 480 26, 280 36, 110 54 C 280 46, 450 44, 590 50" fill="none" stroke="#e11d2e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <!-- mockup 3D -->
  <div class="a" style="left:0;top:0;width:1080px;height:1350px;perspective:1700px;perspective-origin:50% 55%">
    <div class="a" style="left:160px;top:470px;width:760px;height:520px;border-radius:30px;background:#fff;overflow:hidden;
      transform:rotateX(16deg) rotateY(-18deg) rotateZ(-5deg);box-shadow:0 50px 100px rgba(20,20,22,.22),0 0 0 2px rgba(255,255,255,.9)">
      <div class="bar"><i style="left:24px;background:#e11d2e"></i><i style="left:46px;background:#f2a1a8"></i><i style="left:68px;background:#d6d6db"></i>
        <div style="position:absolute;left:110px;right:24px;top:12px;height:34px;border-radius:17px;background:#fff;border:2px solid #e6e6e9;font:500 17px/30px Sora;color:#77777f;padding-left:20px">www.suaempresa.com.br</div></div>
      <div class="a" style="left:34px;right:34px;top:84px;display:flex;justify-content:space-between;align-items:center"><div class="lg">SuaMarca</div>
        <div style="display:flex;gap:20px;font:600 17px Sora;color:#6b6b73"><span>Início</span><span>Serviços</span><span style="color:#e11d2e">Contato</span></div></div>
      <div class="a" style="left:34px;right:34px;top:136px;height:230px;border-radius:22px;background:linear-gradient(135deg,#e11d2e,#9a1420);padding:34px;overflow:hidden">
        <div style="font:800 50px/1.02 Sora;letter-spacing:-.045em;color:#fff">Sua marca<br>no topo.</div>
                <div style="position:absolute;left:34px;bottom:26px;height:46px;padding:0 24px;border-radius:23px;background:#fff;color:#e11d2e;font:700 18px/46px Sora">Fale conosco →</div>
        <div style="position:absolute;right:30px;top:30px;width:170px;height:170px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;transform:rotate(8deg)">
          <b style="border-radius:12px;background:rgba(255,255,255,.2)"></b><b style="border-radius:12px;background:#fff"></b><b style="border-radius:12px;background:rgba(255,255,255,.2)"></b>
          <b style="border-radius:12px;background:#fff"></b><b style="border-radius:12px;background:rgba(255,255,255,.2)"></b><b style="border-radius:12px;background:rgba(255,255,255,.2)"></b>
          <b style="border-radius:12px;background:rgba(255,255,255,.2)"></b><b style="border-radius:12px;background:rgba(255,255,255,.2)"></b><b style="border-radius:12px;background:#fff"></b></div>
      </div>
      <div class="a" style="left:34px;right:34px;top:388px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
        <div style="height:110px;border-radius:18px;border:2px solid #ececef;padding:18px"><div style="width:36px;height:36px;border-radius:11px;background:#fdeceb"></div><div class="ln" style="margin-top:16px"></div></div>
        <div style="height:110px;border-radius:18px;border:2px solid #ececef;padding:18px"><div style="width:36px;height:36px;border-radius:11px;background:#fdeceb"></div><div class="ln" style="margin-top:16px"></div></div>
        <div style="height:110px;border-radius:18px;border:2px solid #ececef;padding:18px"><div style="width:36px;height:36px;border-radius:11px;background:#fdeceb"></div><div class="ln" style="margin-top:16px"></div></div>
      </div>
    </div>
    <!-- cartão vermelho -->
    <div class="a" style="left:690px;top:800px;width:330px;height:230px;border-radius:30px;padding:28px;
      background:linear-gradient(140deg,#ff4a58,#e11d2e 50%,#a50f1c);box-shadow:0 30px 70px rgba(225,29,46,.45),inset 0 2px 0 rgba(255,255,255,.3);
      transform:rotateY(-22deg) rotateZ(4deg)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      <div style="font:800 84px/1 Sora;letter-spacing:-.05em;color:#fff;margin-top:10px">100%</div>
      <div style="font:500 22px Sora;color:rgba(255,255,255,.92);margin-top:8px">responsivo em toda tela</div>
    </div>
  </div>

  <!-- chips -->
  <div class="chip" style="left:60px;top:430px;transform:rotate(-5deg)"><span class="ib"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e11d2e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/></svg></span>Design único</div>
  <div class="chip" style="left:770px;top:478px;transform:rotate(5deg)"><span class="ib"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e11d2e" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg></span>SEO</div>
  <div class="chip dark" style="left:70px;top:930px;transform:rotate(-3deg)"><span class="ib"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></span>Código limpo</div>

  <!-- rodapé -->
  <div class="a" style="left:70px;right:70px;top:1110px;height:2px;background:rgba(20,20,22,.08)"></div>
  <div class="a" style="left:76px;top:1156px;display:flex;align-items:center;gap:14px;font:800 44px Sora;letter-spacing:-.05em;color:#141416">
    <span class="clay" style="width:22px;height:22px;border-radius:50%;display:inline-block"></span>Mosaik<span style="font-weight:300;margin-left:-14px">Conecta</span></div>
  <div class="a glass" style="left:76px;top:1228px;height:62px;padding:0 26px 0 18px;border-radius:31px;gap:12px;font:500 26px Sora;color:#2a2a30">
    <span style="width:24px;height:24px;border-radius:50%;border:3px solid #e11d2e;display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:50%;background:#e11d2e"></span></span>@mosaikconecta</div>
  <div class="a" style="right:76px;top:1172px;height:96px;padding:0 38px;border-radius:48px;background:#e11d2e;color:#fff;font:700 29px/96px Sora;letter-spacing:-.02em;white-space:nowrap;
    box-shadow:0 22px 44px rgba(225,29,46,.38),inset 0 2px 0 rgba(255,255,255,.25)">Solicite seu orçamento →</div>
</div>
<script>
// pré-visualização: ajusta à janela (a imagem final é exportada em 1080×1350)
function fit(){const k=Math.min(1,innerWidth/1080,innerHeight/1350);document.getElementById('post').style.transform=`scale(${k})`}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
