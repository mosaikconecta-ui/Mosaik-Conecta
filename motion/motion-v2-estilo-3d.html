<style>
:root{--red:#e11d2e;--ink:#141416}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0d0f;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:Sora,system-ui,sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;flex:none;transform-origin:center;
  background:radial-gradient(ellipse 80% 60% at 50% 45%,#fbfbfc 0%,#f0f0f2 55%,#e3e3e7 100%)}
.sc,.cam{position:absolute;inset:0}
.sc{overflow:hidden}
.cam{transform-origin:540px 900px}
.a{position:absolute}
.tx{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
.w{display:inline-block}
.glass{background:radial-gradient(circle at 30% 22%,#fff 0%,#f5f5f7 55%,#e6e6ea 100%);
  box-shadow:0 30px 60px rgba(20,20,22,.12),inset 0 -8px 18px rgba(0,0,0,.04),inset 0 4px 10px #fff,0 0 0 2px rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center}
.clay{background:radial-gradient(circle at 32% 26%,#ff7480 0%,#ef3040 30%,#d8192a 58%,#8f0c18 100%);
  box-shadow:inset -14px -18px 30px rgba(60,0,8,.35),inset 10px 12px 24px rgba(255,255,255,.35),0 34px 60px rgba(225,29,46,.38),0 0 0 2px rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center}
.card{position:absolute;border-radius:42px;background:linear-gradient(180deg,#fff,#f3f3f5);
  box-shadow:0 26px 54px rgba(20,20,22,.11),0 0 0 2px rgba(255,255,255,.95),inset 0 -3px 0 rgba(0,0,0,.03);
  display:flex;align-items:center;gap:30px;padding:0 34px;font:500 52px Sora;letter-spacing:-.03em;color:#1b1b1e;white-space:nowrap}
.ib{width:92px;height:92px;border-radius:28px;background:#fdeceb;display:flex;align-items:center;justify-content:center;flex:none}
.ptr{position:absolute;right:34px;bottom:22px}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 60% at 50% 48%,transparent 55%,rgba(0,0,0,.10) 100%)}
/* escuro */
#E{background:#0a0a0c}
.node{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 44px Sora}
.nl{position:absolute;width:420px;margin-left:-210px;text-align:center}
.nl small{display:block;font:600 22px Sora;letter-spacing:.24em;color:#8a8a92}
.nl b{display:block;font:600 44px Sora;color:#fff;letter-spacing:-.02em;margin-top:8px}
/* vermelho */
#F{background:radial-gradient(ellipse 85% 65% at 50% 40%,#ff3a4a 0%,#e11d2e 42%,#a30e1b 100%)}
.gi{position:absolute;border-radius:34%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.38);
  box-shadow:0 24px 50px rgba(90,0,10,.25),inset 0 2px 8px rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
/* mini sites */
.site{position:absolute;background:#fff;overflow:hidden}
.bar{position:absolute;left:0;right:0;top:0;height:56px;background:#f5f5f6;border-bottom:2px solid #ececef}
.bar i{position:absolute;top:21px;width:14px;height:14px;border-radius:50%}
.lg{font:800 26px Sora;letter-spacing:-.04em;color:#141416;display:flex;align-items:center;gap:8px}
.lg:before{content:"";width:12px;height:12px;border-radius:50%;background:#e11d2e}
.ln{height:12px;border-radius:6px;background:#ececef}
#hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font:500 13px sans-serif;color:#8a8a92}
body.render #hint{display:none}
</style>
</head>
